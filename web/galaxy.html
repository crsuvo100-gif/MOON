<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOON -- Knowledge Galaxy</title>
<style>
  :root{ --bg:#05060a; --blue:#39d2ff; --gold:#ffb347; --text:#dbeeff; --dim:#7fa6c9; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(900px 700px at 50% 40%,#0a1426,#05060a 70%);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0}
  .hud{position:fixed;z-index:2;left:18px;top:18px;background:rgba(10,16,28,0.72);border:1px solid rgba(120,180,255,0.18);border-radius:14px;padding:12px 16px;backdrop-filter:blur(8px);max-width:320px}
  .hud h2{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:var(--blue);text-transform:uppercase}
  .row{font-size:12.5px;line-height:1.5;color:var(--dim)}
  .row b{color:var(--text)}
  a{color:var(--blue)}
  #status{position:fixed;z-index:2;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h2>Knowledge Galaxy</h2>
  <div class="row"><b id="count">0</b> nodes (tools + concepts). Edges link tools that share a capability family. Pulled live from <b>/api/galaxy</b>.</div>
  <div class="row" style="margin-top:8px"><a href="/brain">&larr; Back to Command Center</a></div>
</div>
<div id="status">connecting to galaxy stream…</div>

<script>
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
let W,H,nodes=[],edges=[],drag=null;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
addEventListener("resize",resize);resize();

function layout(){
  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.36;
  nodes.forEach((n,i)=>{
    if(n.fixed) return;
    if(n.x===undefined){const a=(i/nodes.length)*Math.PI*2; n.x=cx+Math.cos(a)*R*(0.5+Math.random()); n.y=cy+Math.sin(a)*R*(0.5+Math.random()); n.vx=0; n.vy=0;}
  });
}
function step(){
  layout();
  // simple repulsion + edge spring
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy)||1;
      const rep=4000/(d*d);
      a.vx+=dx/d*rep; a.vy+=dy/d*rep; b.vx-=dx/d*rep; b.vy-=dy/d*rep;
    }
  }
  for(const e of edges){
    const a=nodes[e[0]], b=nodes[e[1]]; if(!a||!b) continue;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const f=(d-120)*0.01;
    a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f;
  }
  for(const n of nodes){
    if(n.fixed) continue;
    n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(30,Math.min(W-30,n.x)); n.y=Math.max(30,Math.min(H-30,n.y));
  }
}
let hover=null;
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=1;
  for(const e of edges){const a=nodes[e[0]],b=nodes[e[1]]; if(!a||!b)continue; ctx.strokeStyle="rgba(120,180,255,0.18)"; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();}
  for(let i=0;i<nodes.length;i++){const n=nodes[i];
    const isHover=hover===i;
    ctx.beginPath(); ctx.arc(n.x,n.y,isHover?9:5,0,Math.PI*2);
    ctx.fillStyle=n.kind==="tool"?"#39d2ff":"#ffb347"; ctx.fill();
    if(isHover||n.kind==="tool"){ctx.fillStyle="#dbeeff"; ctx.font="12px system-ui"; ctx.fillText(n.label,n.x+10,n.y+4);}
  }
}
function loop(){step();draw();requestAnimationFrame(loop);} loop();

function load(nlist){
  nodes=nlist.map(n=>({label:n.label,kind:n.kind||"concept",x:undefined}));
  edges=[];
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.label,i]));
  for(const n of nlist) for(const e of (n.edges||[])){ if(e in idx) edges.push([idx[n.label],idx[e]]); }
  document.getElementById("count").textContent=nodes.length;
}

// pull initial snapshot
fetch("/api/galaxy").then(r=>r.json()).then(d=>load(d.nodes||[])).catch(()=>{});

// live stream
let ws;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws/galaxy`);
  ws.onmessage=ev=>{try{const m=JSON.parse(ev.data); if(m.nodes) load(m.nodes);}catch{}}
  ws.onclose=()=>setTimeout(connect,2000);
  ws.onopen=()=>document.getElementById("status").textContent="galaxy stream live";
}
connect();

canvas.addEventListener("mousemove",e=>{
  const r=canvas.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
  hover=null;
  for(let i=0;i<nodes.length;i++){const n=nodes[i]; if(Math.hypot(n.x-mx,n.y-my)<10){hover=i;break;}}
});
canvas.addEventListener("mousedown",e=>{ if(hover!==null){nodes[hover].fixed=true; drag=hover;}});
addEventListener("mouseup",()=>{ if(drag!==null){nodes[drag].fixed=false; drag=null;}});
canvas.addEventListener("mousemove",e=>{ if(drag!==null){const r=canvas.getBoundingClientRect(); nodes[drag].x=e.clientX-r.left; nodes[drag].y=e.clientY-r.top;}});
</script>
</body>
</html>
