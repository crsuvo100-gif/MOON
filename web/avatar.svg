<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="skin" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffe3d0"/>
      <stop offset="55%" stop-color="#f6c4a6"/>
      <stop offset="100%" stop-color="#c98e72"/>
    </radialGradient>
    <radialGradient id="hair" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#4a2b6b"/>
      <stop offset="60%" stop-color="#2a1740"/>
      <stop offset="100%" stop-color="#150a24"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fe9ff"/>
      <stop offset="100%" stop-color="#1d6f9c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- hair back -->
  <path d="M120 26 C70 26 50 70 52 120 C54 170 78 214 120 214 C162 214 186 170 188 120 C190 70 170 26 120 26 Z" fill="url(#hair)"/>
  <!-- face -->
  <ellipse cx="120" cy="122" rx="58" ry="70" fill="url(#skin)"/>
  <!-- hair front sweep -->
  <path d="M120 24 C82 24 58 52 60 96 C66 64 92 44 120 44 C150 44 176 66 182 98 C184 54 160 24 120 24 Z" fill="url(#hair)"/>
  <path d="M60 96 C58 130 64 150 74 162 C70 138 70 116 78 100 Z" fill="url(#hair)" opacity="0.9"/>
  <path d="M182 98 C180 132 174 152 164 164 C168 140 168 118 160 102 Z" fill="url(#hair)" opacity="0.9"/>
  <!-- brows -->
  <path d="M86 104 q14 -10 30 -2" stroke="#3a2233" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M126 102 q16 -8 30 2" stroke="#3a2233" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="100" cy="118" rx="13" ry="9" fill="#fff"/>
  <ellipse cx="142" cy="116" rx="13" ry="9" fill="#fff"/>
  <circle cx="101" cy="119" r="6.5" fill="url(#eye)" filter="url(#glow)"/>
  <circle cx="143" cy="117" r="6.5" fill="url(#eye)" filter="url(#glow)"/>
  <circle cx="103" cy="120" r="2.4" fill="#06121a"/>
  <circle cx="145" cy="118" r="2.4" fill="#06121a"/>
  <!-- lashes -->
  <path d="M87 116 q13 -7 26 0" stroke="#2a1740" stroke-width="2" fill="none"/>
  <path d="M129 114 q13 -7 26 0" stroke="#2a1740" stroke-width="2" fill="none"/>
  <!-- nose -->
  <path d="M120 124 q-6 16 -2 24 q6 4 12 -1" stroke="#b07a5f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="86" cy="146" rx="11" ry="7" fill="#ff7ac0" opacity="0.32"/>
  <ellipse cx="154" cy="144" rx="11" ry="7" fill="#ff7ac0" opacity="0.32"/>
  <!-- lips -->
  <path d="M104 158 q16 14 32 0 q-16 9 -32 0 Z" fill="#e0497f"/>
  <path d="M104 158 q16 6 32 0" stroke="#a8325c" stroke-width="2" fill="none"/>
  <!-- holographic forehead HUD marker -->
  <circle cx="120" cy="92" r="3" fill="#00f3ff" filter="url(#glow)"/>
  <path d="M120 95 v10 M114 99 h12" stroke="#00f3ff" stroke-width="1" opacity="0.6"/>
</svg>
