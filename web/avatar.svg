<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="moonG" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#eafaff"/>
      <stop offset="45%" stop-color="#9fe8ff"/>
      <stop offset="100%" stop-color="#2b6f8f"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- orbiting neon ring -->
  <g fill="none" stroke="#00e6ff" stroke-opacity="0.5">
    <ellipse cx="120" cy="120" rx="104" ry="104"/>
  </g>
  <!-- moon body -->
  <circle cx="120" cy="120" r="78" fill="url(#moonG)" filter="url(#glow)"/>
  <!-- craters -->
  <circle cx="98" cy="102" r="12" fill="#3a7e9c" opacity="0.55"/>
  <circle cx="140" cy="135" r="16" fill="#3a7e9c" opacity="0.5"/>
  <circle cx="120" cy="95" r="7" fill="#3a7e9c" opacity="0.5"/>
  <!-- blush + eyes (cute wife vibe) -->
  <circle cx="100" cy="120" r="6" fill="#0a3a4a"/>
  <circle cx="140" cy="120" r="6" fill="#0a3a4a"/>
  <circle cx="88" cy="138" r="9" fill="#ff7ac0" opacity="0.6"/>
  <circle cx="152" cy="138" r="9" fill="#ff7ac0" opacity="0.6"/>
  <path d="M104 144 Q120 158 136 144" stroke="#0a3a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- orbiting nodes -->
  <g>
    <circle cx="120" cy="16" r="5" fill="#ff3dcb">
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="16" r="5" fill="#00e6ff">
      <animateTransform attributeName="transform" type="rotate" from="120 120 120" to="480 120 120" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="16" r="4" fill="#ff3dcb">
      <animateTransform attributeName="transform" type="rotate" from="240 120 120" to="600 120 120" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- pulsing halo -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#ff3dcb" stroke-width="2">
    <animate attributeName="r" values="88;98;88" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
