<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOON NEURAL CORE INTERFACE</title>
<style>
:root{
  --bg:#020000;--panel:rgba(8,0,0,.88);--red:#ff1c1c;--hot:#ff5353;
  --line:#e21b1b;--line2:#ff3a3a;--text:#ff6e6e;--muted:#ff9a9a;
  --green:#5cff88;--amber:#ffb64a;--blue:#7ba7ff;
  --ff:'Rajdhani','Share Tech Mono','Courier New',sans-serif;
  --ff-title:'Orbitron','Rajdhani',sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--text);font-family:var(--ff);font-weight:500}
body{display:grid;place-items:center}
#app{
  position:relative;width:100vw;height:100vh;overflow:hidden;background:
  radial-gradient(circle at 50% 43%,rgba(255,0,0,.10),transparent 30%),
  radial-gradient(circle at 50% 65%,rgba(255,0,0,.05),transparent 45%),
  linear-gradient(#060000,#010101);border:1px solid #350707;
  box-shadow:0 0 45px rgba(255,0,0,.18),inset 0 0 70px rgba(255,0,0,.05)
}
#app.manual{width:100vw!important;height:100vh!important}
.grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,0,0,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,0,.12) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 82%);pointer-events:none;z-index:0}
.scan{position:absolute;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(255,0,0,.014) 0 1px,transparent 1px 4px)}
/* FUTURISTIC POLISH PASS (additive — enhances look, keeps all data wiring) */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
.fxparticles{position:absolute;inset:0;pointer-events:none;z-index:96}
.gridfloor{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;z-index:1;
  background:
    linear-gradient(transparent, rgba(255,0,0,.05) 80%),
    repeating-linear-gradient(90deg, rgba(255,40,40,.18) 0 1px, transparent 1px 42px);
  transform:perspective(420px) rotateX(68deg);transform-origin:bottom;opacity:.5;
  mask-image:linear-gradient(to top, #000, transparent 92%)}
.beam{position:absolute;left:50%;top:18%;width:2px;height:62%;transform:translateX(-50%);pointer-events:none;z-index:2;
  background:linear-gradient(to bottom, transparent, rgba(255,60,60,.55), transparent);
  filter:blur(2px);animation:beamflick 5s ease-in-out infinite}
@keyframes beamflick{0%,100%{opacity:.35}50%{opacity:.8}}
/* per-panel sweep + glossy header */
.panel{transition:box-shadow .3s, border-color .3s}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:linear-gradient(115deg, transparent 0 42%, rgba(255,90,90,.10) 50%, transparent 58% 100%);
  background-size:280% 100%;animation:psweep 6s linear infinite;opacity:.0}
.panel:hover::after{opacity:1}
@keyframes psweep{to{background-position:-280% 0}}
.panel>h3{position:relative;z-index:7}
h3{text-shadow:0 0 10px rgba(255,30,30,.8),0 0 4px rgba(255,80,80,.5)}
/* glossy header chips */
.metric{position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;left:-40%;top:0;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,120,120,.18),transparent);transform:skewX(-20deg);animation:chipgloss 7s ease-in-out infinite}
@keyframes chipgloss{0%,76%{left:-40%}82%,100%{left:130%}}
/* avatar core cortex pulse + brighter rings */
@keyframes cortex{0%,100%{box-shadow:0 0 20px rgba(255,0,0,.8),inset 0 0 24px rgba(255,0,0,.55)}50%{box-shadow:0 0 36px rgba(255,60,60,1),inset 0 0 34px rgba(255,40,40,.8)}}
.avatar .core{animation:cortex 2.4s ease-in-out infinite}
/* subtle CRT flicker on whole app */
@keyframes crt{0%,100%{opacity:1}50%{opacity:.97}}
#app{animation:crt 8s ease-in-out infinite}
.title b{text-shadow:0 0 14px var(--red),0 0 26px rgba(255,0,0,.5)}
/* MEDIUM + BOLD typography upgrade (terminal fonts medium weight, titles/labels/buttons bold) */
h3,.nav,.metric strong,.btn,.title,.bcell h4,.logo,.aspectTitle,.ratio,.navcol .nav{font-weight:700}
.title b{font-weight:900}
.nav small,.metric em,.tag,.sub,.stats,.stats b{font-weight:500}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3a3a;box-shadow:0 0 8px #f22;margin-right:6px;animation:ledblink 1.6s ease-in-out infinite}
@keyframes ledblink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes hotpulse{0%,100%{box-shadow:inset 0 0 120px rgba(255,0,0,.08)}50%{box-shadow:inset 0 0 190px rgba(255,0,0,.18)}}
/* ADVANCED FRAME (richer, ornate) */
#app{border-width:2px}
#app:before,#app:after{content:"";position:absolute;width:7%;height:7%;pointer-events:none;z-index:90;border:2px solid var(--red);box-shadow:0 0 14px rgba(255,0,0,.5)}
#app:before{left:0;top:0;border-right:0;border-bottom:0}
#app:after{right:0;bottom:0;border-left:0;border-top:0}
.frame-tr,.frame-bl{position:absolute;width:7%;height:7%;pointer-events:none;z-index:90;border:2px solid var(--red);box-shadow:0 0 14px rgba(255,0,0,.5)}
.frame-tr{right:0;top:0;border-left:0;border-bottom:0}.frame-bl{left:0;bottom:0;border-right:0;border-top:0}
/* rotating energy ring around the whole frame + ornate corner brackets */
.energy{position:absolute;inset:0;pointer-events:none;z-index:91;border:1px solid rgba(255,40,40,.25);border-radius:3px;
  box-shadow:inset 0 0 60px rgba(255,0,0,.12),0 0 30px rgba(255,0,0,.18)}
.energy:before{content:"";position:absolute;inset:-2px;border-radius:3px;border-top:2px solid rgba(255,90,90,.6);border-bottom:2px solid rgba(255,90,90,.15);
  animation:energyrotate 9s linear infinite;clip-path:polygon(0 0,50% 0,50% 2px,2px 2px,2px 50%,0 50%)}
@keyframes energyrotate{to{transform:rotate(360deg)}}
.appframe i{position:absolute;width:5.5%;height:5.5%;pointer-events:none;z-index:92;border:3px solid var(--red);filter:drop-shadow(0 0 8px #f33)}
.appframe .tl{left:0;top:0;border-right:0;border-bottom:0}.appframe .tr{right:0;top:0;border-left:0;border-bottom:0}
.appframe .bl{left:0;bottom:0;border-right:0;border-top:0}.appframe .br{right:0;bottom:0;border-left:0;border-top:0}
/* BRIGHTER + RICHER frame upgrade */
#app{border:2px solid var(--red);box-shadow:0 0 70px rgba(255,0,0,.35),0 0 140px rgba(255,20,20,.15),inset 0 0 90px rgba(255,0,0,.10)}
.energy{box-shadow:inset 0 0 80px rgba(255,0,0,.18),0 0 50px rgba(255,0,0,.30)}
.energy:before{border-top:2px solid rgba(255,120,120,.95);border-bottom:2px solid rgba(255,120,120,.35);box-shadow:0 0 12px #f55}
.appframe i{border-width:4px;filter:drop-shadow(0 0 14px #ff2a2a)}
.frame-tr,.frame-bl{border-width:3px;box-shadow:0 0 22px rgba(255,0,0,.8)}
#app:before,#app:after{border-width:3px;box-shadow:0 0 22px rgba(255,0,0,.8)}
.panel{border:1px solid var(--line2);box-shadow:inset 0 0 22px rgba(255,0,0,.10),0 0 18px rgba(255,0,0,.18)}
.brainPanel{animation:corebreathe 5s ease-in-out infinite}
@keyframes corebreathe{0%,100%{box-shadow:inset 0 0 40px rgba(255,0,0,.10)}50%{box-shadow:inset 0 0 80px rgba(255,0,0,.22)}}
.title{text-shadow:0 0 18px rgba(255,0,0,.6),0 0 30px rgba(255,30,30,.4)}
.logo{font-family:var(--ff-title);letter-spacing:.06em}

.panel{position:relative;background:linear-gradient(145deg,rgba(24,2,2,.92),rgba(4,4,4,.93));border:1px solid var(--line2);clip-path:polygon(0 9px,9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px));box-shadow:inset 0 0 16px rgba(255,0,0,.045),0 0 8px rgba(255,0,0,.05);overflow:hidden}
h3{margin:0;color:#eee;font-size:clamp(7px,.63vw,12px);letter-spacing:.05em;font-family:var(--ff-title)}
h3:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);margin:0 6px 1px 0}

header{position:absolute;left:.7%;right:.7%;top:.7%;height:9.1%;display:grid;grid-template-columns:9% 28% 10% 10% 13% 10% 7% 13%;gap:.25%;z-index:5}
.hcell{height:100%}
.logo{display:grid;place-items:center;font-weight:800;font-size:clamp(10px,1.15vw,23px);color:var(--red);text-shadow:0 0 14px var(--red),0 0 26px rgba(255,30,30,.6)}
.logo:before{content:"";position:absolute;width:6%;aspect-ratio:1;border:2px solid var(--red);border-radius:50%;box-shadow:0 0 12px var(--red),inset 0 0 14px rgba(255,0,0,.2)}
.logo span{position:relative;z-index:1}
.title{padding:1.2% 3%;font-size:clamp(10px,1.35vw,25px);font-weight:700;font-family:var(--ff-title)}.title b{color:var(--red)}.sub{display:block;color:#dc3b3b;font-size:.43em;margin-top:4px}
.metric{text-align:center;padding-top:8px;font-size:clamp(9px,.72vw,15px);font-weight:600;color:#ff7a7a}.metric strong{display:block;margin-top:4px;color:#ff4a4a;font-weight:900;font-size:clamp(14px,1.4vw,26px);text-shadow:0 0 14px rgba(255,0,0,.85)}.metric em{font-style:normal;font-weight:600;color:#ff8a8a;font-size:.78em}

.main{position:absolute;left:.7%;right:.7%;top:10.5%;bottom:18.2%;display:grid;grid-template-columns:7.5% 20.5% 38% 33.5%;gap:.7%;z-index:3}
.navcol,.stack{display:flex;flex-direction:column;gap:4px;min-height:0}
.nav{padding:7px 6px;display:flex;align-items:center;gap:6px;color:#ff8a8a;font-size:clamp(8px,.7vw,14px);font-weight:700;min-height:9.2%;cursor:pointer;letter-spacing:.02em}.nav small{display:block;color:#ff5a5a;font-weight:600;margin-top:2px;font-size:.82em}.nav.active{border-color:#ff2d2d;box-shadow:0 0 18px rgba(255,0,0,.30),inset 0 0 12px rgba(255,0,0,.12);color:#fff}.ico{width:22px;height:22px;border:1px solid #ff2525;border-radius:50%;display:grid;place-items:center;color:#ff5555;flex:none;font-weight:700}
.leftA{height:29%}.leftB{height:27%}.leftC{height:27%}.logs{flex:1;min-height:0}
.rightA{height:29%}.rightB{height:23%}.rightC{height:17%}.rightD{height:28%}
.panel.pad{padding:8px 9px}
.ring{width:74%;aspect-ratio:1;border-radius:50%;border:1px solid #8e1717;margin:7px auto;background:repeating-radial-gradient(circle,transparent 0 12px,rgba(255,0,0,.18) 13px 14px);box-shadow:inset 0 0 22px rgba(255,0,0,.1),0 0 15px rgba(255,0,0,.08);position:relative;animation:slowspin 11s linear infinite}
.ring:after{content:"";position:absolute;inset:34%;border:2px solid #ff3434;border-radius:50%;box-shadow:0 0 14px #f22}
@keyframes slowspin{to{transform:rotate(360deg)}}
.stats{position:absolute;right:7%;top:24%;width:62%;font-size:clamp(6px,.5vw,10px);line-height:1.75;color:#ff7a7a}.stats b{float:right;color:#ff5a5a;text-shadow:0 0 8px rgba(255,30,30,.7)}
.mini{position:absolute;left:8px;right:8px;bottom:8px;height:29%;border-bottom:1px solid #631010}
.bars{display:flex;gap:2px;height:100%;align-items:end}.bars i{flex:1;display:block;background:#d91616;min-height:2px;animation:bar 1.15s ease-in-out infinite alternate}.bars i:nth-child(2n){animation-delay:-.3s}.bars i:nth-child(3n){animation-delay:-.7s}@keyframes bar{to{height:90%}}
#center{position:relative;min-width:0;min-height:0}
.brainPanel{position:absolute;inset:0 0 25.5% 0;background:radial-gradient(circle at 50% 46%,rgba(255,0,0,.12),rgba(3,3,3,.97) 55%)}#brain{position:absolute;inset:0;width:100%;height:100%}
/* flanking vertical timeline graphs (added vs reference) */
.tlft,.tlrt{position:absolute;top:9%;width:13%;height:78%;z-index:3;opacity:.8}
.tlft{left:1%}.tlrt{right:1%}
.tlft canvas,.tlrt canvas{width:100%;height:100%}
.lobe{position:absolute;width:20%;height:11%;border:1px solid #751414;background:#090000dd;padding:5px;color:#cf4a4a;font-size:clamp(5px,.44vw,9px);z-index:2}.l1{left:1%;top:13%}.l2{left:1%;top:43%}.l3{left:1%;top:73%}.r1{right:1%;top:13%}.r2{right:1%;top:43%}.r3{right:1%;top:73%}
.wave{height:62%;margin-top:4px}.wave svg{width:100%;height:100%}.wave path{fill:none;stroke:#e92828;stroke-width:1.4;stroke-dasharray:4 3;animation:dash 2s linear infinite}@keyframes dash{to{stroke-dashoffset:-70}}
.avatar{position:absolute;left:50%;top:43%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:5;display:grid;place-items:center;pointer-events:auto;cursor:pointer;transition:filter .25s}.avatar:hover{filter:drop-shadow(0 0 16px rgba(255,40,40,.75))}.avatar.core-active{filter:drop-shadow(0 0 26px #f55) brightness(1.3)}.avatar .core3d{width:100%;aspect-ratio:1;border-radius:50%;pointer-events:none}.avatar:before,.avatar:after{content:"";position:absolute;border:1px solid rgba(255,50,50,.75);border-radius:50%;inset:-7%;animation:orbit 6s linear infinite}.avatar:after{inset:-18%;animation-direction:reverse;animation-duration:10s;opacity:.45}@keyframes orbit{to{transform:rotate(360deg)}}.avatar.core-active:before,.avatar.core-active:after{box-shadow:0 0 30px #ff2a2a,inset 0 0 30px #f33;border-color:#ff5a5a}
.brainStatus{position:absolute;left:18%;right:18%;bottom:3%;height:8%;border:1px solid #8b1717;background:#080000cc;display:grid;place-items:center;font-size:clamp(7px,.55vw,11px);z-index:7}.barline{position:absolute;left:20%;right:20%;bottom:1%;height:3px;background:#240707;z-index:7}.barline i{display:block;height:100%;width:87.6%;background:#ff3434;box-shadow:0 0 8px #f00;transition:width .6s ease}
.matrix{position:absolute;left:0;right:0;bottom:0;height:22%}.matrix canvas{width:100%;height:75%}
.rightTop,.rightMid,.rightMem,.rightThreat{height:100%}
.pipeline{display:flex;justify-content:space-between;gap:2px;margin-top:10px}.step{flex:1;text-align:center;font-size:clamp(5px,.4vw,8px);color:#d55}.step b{display:grid;place-items:center;width:21px;height:21px;border:1px solid #d22;border-radius:50%;margin:auto;color:#f44;background:#150202}.step.on b{background:#ff2a2a;color:#fff;box-shadow:0 0 12px #f00}.step.done b{background:#5cff88;color:#021;border-color:#5cff88}.flow{height:4px;margin-top:10px;background:linear-gradient(90deg,#f22 60%,#260606 60%);box-shadow:0 0 7px #f00}
.threat{height:100%;display:grid;grid-template-columns:60% 40%;gap:6px;padding:8px}.map{background:radial-gradient(circle at 50% 50%,rgba(255,0,0,.35),transparent 40%),repeating-linear-gradient(45deg,rgba(255,0,0,.12) 0 1px,transparent 1px 9px);border:1px solid #651010}
.bottom{position:absolute;left:.7%;right:.7%;bottom:5.6%;height:11.6%;display:grid;grid-template-columns:16% 16% 16% 16% 16% 9% 11%;gap:.5%;z-index:6}.bcell{padding:6px 8px}.bcell h4{margin:0 0 3px;font-size:clamp(8px,.62vw,13px);font-weight:700;font-family:var(--ff-title);color:#ffb0b0;text-shadow:0 0 8px rgba(255,30,30,.6)}.spark{height:70%;position:relative;background:linear-gradient(90deg,transparent,#330505,transparent);overflow:hidden}.spark canvas{width:100%;height:100%}
footer{position:absolute;left:.7%;right:.7%;bottom:.7%;height:4.1%;display:grid;grid-template-columns:23% repeat(7,1fr) 13%;gap:.3%;z-index:20}.cmd{display:flex;align-items:center;gap:7px;padding:0 8px;border:1px solid #711010;background:#070000;font-size:clamp(8px,.66vw,13px);font-weight:600}.cmd input{flex:1;background:#0b0000;border:1px solid #4b0b0b;color:#fff;height:70%;outline:none;font-weight:600}.btn{display:grid;place-items:center;border:1px solid #711010;background:#080000;color:#e06a6a;font-size:clamp(8px,.64vw,13px);font-weight:700;cursor:pointer;letter-spacing:.02em}.btn:hover,.btn.active{background:#300606;color:#fff;box-shadow:0 0 14px rgba(255,0,0,.28)}

/* expandable CLI terminal (merged from folder + wired to real backend) */
#terminal{position:absolute;left:9%;right:12.5%;bottom:5.7%;height:27%;background:#030000f5;border:1px solid #ff2525;box-shadow:0 0 30px rgba(255,0,0,.22);z-index:30;display:none;grid-template-columns:31% 27% 22% 20%;font-family:"Courier New",monospace;font-size:clamp(6px,.55vw,11px)}
#terminal.open{display:grid}
.term{padding:8px;border-right:1px solid #631010;overflow:auto}.term:last-child{border-right:0}.term h4{margin:0 0 5px;color:#ff3333;font-family:var(--ff-title)}.line{color:#c96767;line-height:1.4;white-space:pre-wrap;word-break:break-word}.ok{color:var(--green)}.warn{color:var(--amber)}.you{color:#fff}
#aspect{position:absolute;right:1%;top:11%;width:21%;z-index:40;background:#070000f5;border:1px solid #d21b1b;padding:10px;display:none}.aspectTitle{color:#ff4040;font-weight:700;margin-bottom:7px;font-size:12px;font-family:var(--ff-title)}.ratio{width:100%;margin:4px 0;padding:7px;background:#090000;border:1px solid #5d1010;color:#ddd;text-align:left;cursor:pointer}.ratio.sel{box-shadow:inset 3px 0 #f22}
@media(max-width:1000px){#app{font-size:8px}.main{grid-template-columns:7.5% 22% 40% 30.5%}.rightThreat{display:none}}
.overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(46%,640px);max-height:70%;z-index:60;background:#070000f8;border:1px solid #d21b1b;box-shadow:0 0 30px #f002;display:flex;flex-direction:column}
.overlay.hidden{display:none}
.ovHead{background:#1a0404;color:#ff5a5a;font-family:var(--ff-title);font-weight:700;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:1px}
.ovClose{background:#300;color:#f88;border:1px solid #a33;cursor:pointer;padding:2px 8px}
.ovBody{padding:12px;overflow:auto;color:#e8c8c8;font-size:13px}
.ovRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.ovRow label{color:#ff8a8a;font-size:11px;width:100%}
.ovBtn{background:#120000;border:1px solid #7a1414;color:#ff7a7a;padding:6px 12px;cursor:pointer;font-family:var(--ff-title);font-size:11px}
.ovBtn:hover{background:#2a0606}
#voiceSel{background:#0b0000;border:1px solid #5d1010;color:#fff;padding:5px}
.ovLog{margin-top:10px;background:#0a0000;border:1px solid #4b0b0b;padding:8px;min-height:60px;font-family:'Courier New',monospace;font-size:11px;color:#ff9a9a;white-space:pre-wrap}
#toolRun{flex:1;background:#0b0000;border:1px solid #4b0b0b;color:#fff;padding:6px}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:240px;overflow:auto}
.toolGrid .t{background:#0c0000;border:1px solid #4b0b0b;padding:5px 7px;font-size:11px;color:#ffb3b3;cursor:pointer}
.toolGrid .t:hover{background:#220404}
.overlay.wide{width:min(72%,900px)}
.funcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-height:60vh;overflow:auto}
@media(max-width:1000px){.funcGrid{grid-template-columns:repeat(2,1fr)}}
.funcGrid .f{display:flex;flex-direction:column;gap:2px;background:#0c0000;border:1px solid #5d1010;padding:9px 8px;cursor:pointer;transition:.12s;text-align:left}
.funcGrid .f:hover{background:#240404;box-shadow:0 0 12px #d008;border-color:#ff2a2a}
.funcGrid .f .fi{font-size:17px;line-height:1}
.funcGrid .f .fn{color:#ff7a7a;font-family:var(--ff-title);font-size:11px;letter-spacing:.4px}
.funcGrid .f .fd{color:#9a7a7a;font-size:9px;line-height:1.2}

</head>
<body>
<div id="app">
<div class="grid"></div><div class="scan"></div><div class="hotpulse"></div><div class="gscan"></div>
<canvas class="fxparticles" id="fxParticles"></canvas>
<div class="gridfloor"></div>
<div class="energy"></div><div class="appframe"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="frame-tr"></div><div class="frame-bl"></div>

<header>
  <div class="panel hcell logo"><span>MOON</span></div>
  <div class="panel hcell title"><b>MOON</b> NEURAL CORE INTERFACE<span class="sub">SENTIENT OPERATING SYSTEM v9.7.1 &nbsp;|&nbsp; QUANTUM AI MAINFRAME</span></div>
  <div class="panel hcell metric">CORE TEMP<strong id="temp">37.2°C</strong><em id="tempE">OPTIMAL</em></div>
  <div class="panel hcell metric">QUANTUM LOAD<strong id="load">87.6%</strong><em>STABLE</em></div>
  <div class="panel hcell metric">CORE STATUS<strong id="state">ONLINE</strong><em>PRIME NEURAL UNIT</em></div>
  <div class="panel hcell metric">SYSTEM UPTIME<strong id="up">365:23:58:47</strong><em>DAYS HRS MINS SECS</em></div>
  <div class="panel hcell metric">NET LATENCY<strong id="lat">7.2ms</strong><em>LINK STABLE</em></div>
  <div class="panel hcell metric">THREAT LEVEL<strong id="threat">MINIMAL</strong><em>GLOBAL MONITOR</em></div>
</header>

<section class="main">
  <div class="navcol">

<script>
/* MOON AI-NEUTRAL BRIDGE (kept from attached folder — provider-neutral)
   UI accepts events from any AI/backend through window.MOON_UI.emit({...})
   Optional HTTP endpoint POST /api/moon/event  |  Optional WebSocket ws://<host>/ws/moon */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = id => document.getElementById(id);

function setText(id, v){ const e = el(id); if (e) e.textContent = (v == null ? '' : v); }

window.MOON_UI = {
  state:"IDLE",
  emit(evt){
    if(!evt || typeof evt!=="object") return;
    if(evt.state) setState(String(evt.state).toUpperCase(), evt);
    if(evt.load!=null){ const n=Math.max(0,Math.min(100,Number(evt.load))); setText("load", n.toFixed(1)+"%"); setText("conv", n.toFixed(1)+"%"); const b=el("convBar"); if(b)b.style.width=n+"%"; }
    if(evt.log) addLog(evt.log);
    if(evt.command) command(evt.command);
  }
};

/* ===== backend /status real-data mapping ===== */
function num(v, d=1){ return (v==null||isNaN(v))?null:Number(v).toFixed(d); }
function applyStatus(s){
  s = s || {};
  const sys = s.system || {};
  const mem = s.memory || {};
  const agents = Array.isArray(s.agents) ? s.agents : (typeof s.agents==="number" ? s.agents : 0);
  const agentN = Array.isArray(agents) ? agents.length : (agents||0);

  // header
  setText("temp", (sys.temp_c!=null?num(sys.temp_c,1):"37.2")+"°C");
  setText("tempE", (sys.temp_c!=null && sys.temp_c>55)?"WARN":"OPTIMAL");
  const load = Math.min(99, Math.round((sys.cpu||5) + (s.locked?6:0)));
  setText("load", load+"%");
  setText("state", s.locked? "LOCKED" : "ONLINE");
  setText("up", s.uptime_fmt || "365:23:58:47");
  setText("lat", (sys.net||"7.2ms"));
  setText("threat", "MINIMAL");

  // neural telemetry (real-derived)
  const integ = mem.integrity!=null ? Math.round(mem.integrity*100) : 98.7;
  setText("ndensity", (integ!=null?integ:98.7).toFixed? (integ).toFixed(1)+"%" : "98.7%");
  setText("nsyn", ((agentN*0.07)||1.245).toFixed(3)+" PETA/s");
  setText("nfreq", (2.4 + (sys.cpu||0)*0.004).toFixed(2)+" THz");
  setText("nlat", "0.000"+(10+ (agentN%9))+"s");

  // core configuration (real-derived)
  setText("ncores", (agentN||16384).toLocaleString());
  setText("nnodes", (agentN*65536||1048576).toLocaleString());
  setText("nclusters", (mem.kb_docs? Math.ceil(mem.kb_docs/100):512).toLocaleString());
  setText("nengines", (s.n_tools||128).toLocaleString());
  setText("nthreads", ((agentN*200000)||8200000).toLocaleString().replace(/(\d)(\d{6})$/,"$1.$2").slice(0,3)+"M");

  // power management
  setText("pout", s.locked? "LOCKED":"STABLE");
  setText("peres", (84 + (agentN%9)*0.1).toFixed(1)+"%");
  setText("pcool", "100%");
  setText("pcore", (sys.temp_c!=null?num(sys.temp_c,1):"35.6")+"°C");
  setText("pvolt", "NOMINAL");

  // topology (real-derived)
  setText("tNodes", (agentN*65536||1048576).toLocaleString());
  setText("tConns", (agentN*(agentN-1)*512||86442311).toLocaleString());
  setText("tDens", "97.6%"); setText("tStab","100%"); setText("tLr","0.000785");

  // memory core status (real)
  const ramT = sys.ram_total_mb||0, ramU = sys.ram_used_mb||0;
  if(ramT){ setText("mTotal",(ramT/1e6).toFixed(2)+" PB"); setText("mUsed",(ramU/1e6).toFixed(0)+" TB"); setText("mFree",((ramT-ramU)/1e6).toFixed(0)+" TB"); }
  setText("mInteg","100%"); setText("mRed","5.2x");

  // system monitor (CLI)
  setText("smCpu", (sys.cpu!=null?Math.round(sys.cpu):"--")+"%");
  setText("smMem", (sys.ram_pct!=null?Math.round(sys.ram_pct):"--")+"%");
  setText("smQ", integ? integ.toFixed(1)+"%":"98.77%");
  setText("smNet", sys.net||"2.4 TB/s");
  setText("effTxt", (sys.cpu!=null? (100-Math.round(sys.cpu*0.25)) : "--")+"%");

  // active processes (real agent list)
  const procBox = el("proc");
  if(procBox){
    const list = Array.isArray(agents)? agents.map(a=>a.name||a) : ["Neural_Core","Quantum_Matrix","Memory_Engine","Learning_Engine","Vision_Processor","Language_Model","Security_Monitor","Network_Manager"];
    procBox.innerHTML = list.slice(0,12).map((x,i)=>`<div class="line">${String(i+1).padStart(2,"0")}  ${x}  <span class="ok">ACTIVE</span></div>`).join("");
  }
  // convergence reflects live load
  setText("conv", load+"%"); const b=el("convBar"); if(b)b.style.width=load+"%";
}

/* ===== logs / state ===== */
function addLog(t){
  const box=el("logs"); if(!box)return;
  const d=document.createElement("div"); d.className="line";
  d.textContent=new Date().toLocaleTimeString("en-GB")+"  "+t;
  box.prepend(d); while(box.children.length>40) box.lastChild.remove();
}
function setState(st, data={}){
  window.MOON_UI.state=st;
  setText("state", st==="IDLE"?"ONLINE":st);
  const tb=el("termBtn"); if(tb) tb.classList.toggle("active", st!=="IDLE");
  if(data.load!=null) window.MOON_UI.emit({load:data.load});
  updatePipeline(data.stage);
}
const STAGE_MAP={input:1,data:2,preprocess:2,pattern:3,detection:3,thinking:4,memory:3,knowledge:3,deep:4,decision:5,tools:6,execution:6,action:6,feedback:7,speaking:7,routing:1};
function updatePipeline(stage){
  const n = STAGE_MAP[(stage||"").toLowerCase()];
  $$(".step").forEach(s=>s.classList.remove("on","done"));
  if(!n) return;
  $$(".step").forEach(s=>{ const i=+s.id.replace("p",""); if(i<n)s.classList.add("done"); else if(i===n)s.classList.add("on"); });
}
function command(cmd){
  const v=String(cmd).trim(); if(!v) return;
  if(!el("terminal").classList.contains("open")) el("terminal").classList.add("open");
  const out=el("cliOut");
  const d=document.createElement("div"); d.className="line you"; d.textContent="MOON@NEURAL:~$ "+v; out.appendChild(d);
  const r=document.createElement("div"); r.className="line ok";
  const lc=v.toLowerCase();
  if(lc==="status"){ wsSend({action:"status"}); r.textContent="MOON CORE ONLINE — live status requested."; }
  else if(lc==="diagnostics"){ wsSend({action:"diagnostics"}); r.textContent="Running full self-diagnostics…"; }
  else if(lc.startsWith("memory")){ const q=v.split(/\s+/).slice(1).join(" ")||"recent"; wsSend({action:"memory_search",query:q}); r.textContent="Recall from long-term memory: "+q; }
  else if(lc.startsWith("knowledge")){ const q=v.split(/\s+/).slice(1).join(" ")||"moon"; wsSend({action:"knowledge",query:q}); r.textContent="Querying knowledge base: "+q; }
  else if(lc==="scan"){ setState("EXECUTING"); r.textContent="NEURAL SCAN COMPLETE — 98.726% density."; }
  else if(lc==="learn"||lc==="think"){ setState("THINKING"); r.textContent="LEARNING ENGINE ACTIVE — adaptive cycle started."; }
  else if(lc==="speak"){ setState("SPEAKING"); r.textContent="SPEAKING…"; }
  else if(lc==="execute"){ setState("EXECUTING"); r.textContent="EXECUTING…"; }
  else if(lc==="help"){ r.textContent="Commands: status · diagnostics · memory_search <q> · knowledge <q> · scan · learn · think · speak · execute · clear · help"; }
  else if(lc==="clear"){ out.innerHTML=""; return; }
  else { wsSend({action:"send_message",text:v}); r.textContent="Forwarded to MOON workflow: "+v; }
  out.appendChild(r); out.scrollTop=out.scrollHeight;
}

/* ===== WebSocket to Moon's real backend (/ws) ===== */
let ws=null, _muted=false;
let lastAction=null, toolBuf="";
function wsSend(o){ if(ws && ws.readyState===1){ if(o.action) lastAction=o.action; ws.send(JSON.stringify(o)); } }
function connect(){
  const pr=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${pr}://${location.host}/ws`);
  ws.onopen=()=>{ addLog("[CORE] Quantum link handshake complete."); wsSend({action:"status"}); };
  ws.onmessage=e=>{ let m; try{m=JSON.parse(e.data);}catch(_){return;} handle(m); };
  ws.onerror=()=>addLog("[NETWORK] socket error");
  ws.onclose=()=>{ addLog("[NETWORK] link closed — retrying…"); setTimeout(connect,3000); };
}
function handle(m){
  switch(m.type){
    case "ready": case "status": applyStatus(m.status||m); addLog("[SYSTEM] status received."); if((m.status||m).load!=null) window.MOON_UI.onCorePulse && window.MOON_UI.onCorePulse((m.status||m).load/180); break;
    case "assistant_start": setState("SPEAKING"); addLog("[MOON] thinking…"); window.MOON_UI.onCorePulse&&window.MOON_UI.onCorePulse(0.9); break;
    case "workflow": setState((m.stage||"").toUpperCase(), {stage:m.stage}); addLog("[FLOW] "+(m.stage||"")+": "+(m.detail||"")); window.MOON_UI.onCorePulse&&window.MOON_UI.onCorePulse(0.7); break;
    case "assistant_chunk":
      addLog("[MOON] "+(m.content||""));
      if(lastAction==="list_tools"){ toolBuf += (m.content||""); }
      window.MOON_UI.onCorePulse&&window.MOON_UI.onCorePulse(0.25);
      break;
    case "audio": playWav(m.data); window.MOON_UI.onCorePulse&&window.MOON_UI.onCorePulse(0.5); break;
    case "assistant_done":
      setState("IDLE"); addLog("[MOON] done in "+(m.elapsed||0)+"s"+(m.locked?" [locked]":""));
      if(lastAction==="list_tools"){ renderToolGrid(toolBuf); toolBuf=""; }
      break;
  }
}
function playWav(b64){
  try{
    const bin=atob(b64); const buf=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    new AudioContext().decodeAudioData(buf.buffer.slice(0),a=>{
      if(_muted)return; const src=new AudioContext().createBufferSource(); src.buffer=a; src.connect(new AudioContext().destination); src.start();
    });
  }catch(_){}
}

/* ===== ambient canvases (brain + matrix + flanking timelines + bottom sparks) ===== */
const c=el("brain"), x=c.getContext("2d"), m=el("matrix"), mx=m.getContext("2d");
let pts=[];
function size(){const d=devicePixelRatio||1;
  [["brain",c,x],["matrix",m,mx],["tlL",el("tlL")],["tlR",el("tlR")],["spSyn"],["spFeed"],["spMem"],["spLearn"],["spVoice"],["spQc"]].forEach(([id,cv])=>{
    const e=el(id); if(!e)return; const ctx=e.getContext?e.getContext("2d"):null;
    e.width=e.clientWidth*d; e.height=e.clientHeight*d; if(ctx)ctx.setTransform(d,0,0,d,0,0);
  });
  if(!pts.length)for(let i=0;i<280;i++)pts.push({a:Math.random()*Math.PI*2,r:.05+Math.random()*.95,s:.2+Math.random()});
}
const sparks={};
function spark(id,color){const e=el(id);if(!e)return;const ctx=e.getContext("2d");const buf=new Array(80).fill(0);let t=0;
  (function draw(){requestAnimationFrame(draw);if(!e.width)return;t+=0.08;const w=e.clientWidth,h=e.clientHeight;ctx.clearRect(0,0,w,h);
    const tg=0.4+0.4*Math.sin(t)+Math.random()*0.2;buf.push(tg);buf.shift();
    ctx.strokeStyle=color;ctx.lineWidth=1.2;ctx.beginPath();
    for(let i=0;i<buf.length;i++){const X=i/buf.length*w,Y=h/2 - buf[i]*(h*0.42);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();})();
}
function brain(t){const w=c.clientWidth,h=c.clientHeight,cx=w/2,cy=h*.46,R=Math.min(w,h)*.35;x.clearRect(0,0,w,h);x.save();x.translate(cx,cy);
  for(let k=0;k<9;k++){x.beginPath();x.arc(0,0,R*(.40+k*.07),0,Math.PI*2);x.strokeStyle=`rgba(255,25,25,${.12-k*.009})`;x.stroke()}
  const p=pts.map(q=>{const a=q.a+t*.00025*q.s,rr=q.r*R;return{x:Math.cos(a)*rr,y:Math.sin(a)*rr*(.72+.28*Math.cos(q.a*2))}});
  for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){const dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,d=Math.hypot(dx,dy);if(d<R*.17){x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.strokeStyle=`rgba(255,40,40,${(1-d/(R*.17))*.17})`;x.stroke()}}
  p.forEach((q,i)=>{x.beginPath();x.arc(q.x,q.y,1.05+(i%4)*.35,0,Math.PI*2);x.fillStyle=i%19===0?"#fff":"#f22";x.shadowBlur=i%19===0?10:4;x.shadowColor="#f22";x.fill()});
  x.shadowBlur=26;x.fillStyle="#fff";x.beginPath();x.arc(0,0,4+Math.sin(t*.004)*1.5,0,Math.PI*2);x.fill();x.restore();
}
function matrix(t){const w=m.clientWidth,h=m.clientHeight;mx.clearRect(0,0,w,h);
  for(let i=0;i<60;i++){const xx=w/2+Math.sin(i*2.17+t*.0008)*w*.48,yy=h/2+(i/60-.5)*h;mx.beginPath();mx.moveTo(w/2,h/2);mx.lineTo(xx,yy);mx.strokeStyle="rgba(255,35,35,.23)";mx.stroke()}
  mx.beginPath();mx.arc(w/2,h/2,Math.min(w,h)*.12+Math.sin(t*.003)*3,0,Math.PI*2);mx.strokeStyle="#ff3333";mx.shadowBlur=15;mx.shadowColor="#f00";mx.stroke();
}
function timeline(id,t,phase){const e=el(id);if(!e)return;const ctx=e.getContext("2d");const w=e.clientWidth,h=e.clientHeight;if(!w)return;ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(255,50,50,.5)";ctx.lineWidth=1;ctx.beginPath();
  for(let y=0;y<=h;y+=6){const amp=Math.sin(y*0.05+t*0.002+phase)*8*Math.exp(-Math.abs(y-h/2)/(h*0.5));const X=w/2+amp;y?ctx.lineTo(X,y):ctx.moveTo(X,y);}ctx.stroke();
  ctx.fillStyle="rgba(255,80,80,.7)";ctx.font="8px monospace";
  [15,30,45,60,75].forEach(v=>ctx.fillText(v.toFixed(2)+"s",2,h*(v/80)));
}

/* 3D animated MOON neural core — rotates + reacts to Moon's brain (load/workflow) */
const coreCv=el("core3d"); let coreCtx=null, coreNodes=[], coreActivity=0;
if(coreCv){ coreCtx=coreCv.getContext("2d");
  for(let i=0;i<70;i++){ // fibonacci-ish sphere distribution
    const y=1-(i/(70-1))*2, r=Math.sqrt(1-y*y), th=i*2.399963;
    coreNodes.push({x:Math.cos(th)*r, y:y, z:Math.sin(th)*r});
  }
}
function core3d(t){
  if(!coreCv||!coreCtx) return;
  const d=devicePixelRatio||1, w=coreCv.clientWidth, h=coreCv.clientHeight;
  if(coreCv.width!==w*d){coreCv.width=w*d;coreCv.height=h*d;} coreCtx.setTransform(d,0,0,d,0,0);
  coreCtx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, R=Math.min(w,h)*0.42;
  const ax=t*0.00045, ay=t*0.00030;
  const ca=Math.cos(ax), sa=Math.sin(ax), cb=Math.cos(ay), sb=Math.sin(ay);
  const act=Math.min(1,coreActivity); // 0..1 reactive energy from backend
  const pulse=1+0.06*Math.sin(t*0.004)+act*0.10;
  const pts=coreNodes.map(n=>{
    let x=n.x*R, y=n.y*R, z=n.z*R;
    let x1=x*ca - z*sa, z1=x*sa + z*ca;       // rotate Y
    let y1=y*cb - z1*sb, z2=y*sb + z1*cb;       // rotate X
    return {x:cx+x1*pulse, y:cy+y1*pulse, z:z2, s:(z2/R+1)/2};
  });
  pts.sort((a,b)=>a.z-b.z);
  // wireframe links between nearby nodes
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, dz=pts[i].z-pts[j].z;
    if(dx*dx+dy*dy+dz*dz < (R*0.42)*(R*0.42)){
      coreCtx.beginPath();coreCtx.moveTo(pts[i].x,pts[i].y);coreCtx.lineTo(pts[j].x,pts[j].y);
      coreCtx.strokeStyle=`rgba(255,${(60+act*120)|0},${(60+act*80)|0},${0.10+ (1-pts[i].s)*0.10})`;coreCtx.lineWidth=0.8;coreCtx.stroke();
    }
  }
  pts.forEach((p,i)=>{
    coreCtx.beginPath();coreCtx.arc(p.x,p.y,(0.8+(1-p.s)*1.6)+act*1.5,0,Math.PI*2);
    coreCtx.fillStyle=i%17===0?`rgba(255,200,200,${0.9})`:`rgba(255,${(40+act*120)|0},40,${0.55+ (1-p.s)*0.35})`;
    coreCtx.shadowBlur=6+act*10;coreCtx.shadowColor="#f22";coreCtx.fill();
  });
  coreCtx.shadowBlur=0;
  // decay activity over time so it pulses on events then calms
  coreActivity*=0.985;
}
