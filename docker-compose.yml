version: "3.8"

services:
  moon:
    build: .
    container_name: moon-ai
    ports:
      - "8777:8777"
    environment:
      - MOON_PORT=8777
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
    volumes:
      - ./MOON_HOME:/app/MOON_HOME
      - moon_memory:/app/memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8777/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  moon_memory:
