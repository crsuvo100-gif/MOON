# MOON display flicker fix (Intel Ice Lake, X11/XFCE).
# TearFree + modesetting stops compositor tearing and fullscreen blit flicker.
# Install as root:
#   sudo install -D -m644 /home/meow/Projects/MOON/docs/20-intel.conf /etc/X11/xorg.conf.d/20-intel.conf
#   sudo update-grub   # not needed for this file; only for the grub PSR/RC6 line below
# then reboot.
Section "Device"
    Identifier "Intel Graphics"
    Driver "modesetting"
    Option "TearFree" "true"
    Option "AccelMethod" "glamor"
EndSection
