name: MOON CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: "Best-effort: start Ollama and pull a tiny model"
        # Live tests are marked @pytest.mark.live and auto-skip when Ollama is
        # unreachable. If we can bring Ollama up here, they actually run; if not,
        # the suite stays green (skips are clearly labeled). Either way CI is honest.
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh || true
          which ollama && (ollama serve >/tmp/ollama.log 2>&1 &) || true
          for i in $(seq 1 20); do curl -s http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 2; done
          ollama pull qwen2.5:0.5b || true

      - name: Run tests
        run: |
          . .venv/bin/activate
          unset PYTHONPATH
          python -m pytest tests -q -p no:cacheprovider

      - name: Import sweep (every module imports cleanly)
        run: |
          . .venv/bin/activate
          unset PYTHONPATH
          python -c "import importlib, pkgutil, app; [importlib.import_module(m.name) for m in pkgutil.walk_packages(app.__path__,'app.')]; print('IMPORT_SWEEP_OK')"
