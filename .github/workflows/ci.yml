name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv and install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import smoke test (all app modules)
        run: |
          . .venv/bin/activate
          python -c "import app.terminal_interface, app.dashboard, app.voice, app.brain.orchestrator"
      - name: Run tests
        run: |
          . .venv/bin/activate
          env -u PYTHONPATH python -m pytest tests -q
      - name: Lint (ruff, non-blocking)
        run: |
          . .venv/bin/activate
          ruff --version && ruff check app || true
