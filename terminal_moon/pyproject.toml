[project]
name = "moontm"
version = "1.0.0"
description = "MOON Terminal — AI agent terminal interface (Textual TUI + CLI REPL + FastAPI/WS backend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "textual>=0.50",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "langdetect>=1.0",
    "scipy>=1.10",
    "numpy>=1.24",
    "requests>=2.28",
    "setproctitle>=1.3",
]

[project.scripts]
moon = "app.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
